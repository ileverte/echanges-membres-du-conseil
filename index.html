<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dossiers Ile Verte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2317694A'/%3E%3Cpath d='M5 11.5 12 6l7 5.5M7 10.5V18h10v-7.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.auth{display:grid;gap:12px}
.auth label{display:grid;gap:5px}
.adm-list{display:grid;gap:6px;max-height:300px;overflow:auto}
.adm-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:.9rem}
.adm-row span{min-width:0;overflow-wrap:anywhere}
/* Layout: barre de rubriques en haut, liste des dossiers à gauche, fil du dossier à droite ; une seule colonne sur téléphone. */
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --surface-2:#E7EEE9; --ink:#13201A; --muted:#5A6A62; --line:#D3DED7;
  --accent:#17694A; --accent-ink:#FFFFFF; --accent-soft:#DCEFE5;
  --c-ago:#4B4FB5; --c-travaux:#9C5C07; --c-intervention:#08737E; --c-signalement:#B3312A; --c-reunion:#7A3E8F;
  --ok:#17694A; --warn:#9C5C07; --danger:#B3312A;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 6px 24px rgba(19,32,26,.07);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
.muted{color:var(--muted)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand h1{font-size:1.12rem;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px 3px 3px;max-width:220px}
.me img{width:28px;height:28px;border-radius:50%}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.86rem;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.tab .n{font-family:var(--f-mono);font-size:.72rem;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:1px 7px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-pressed="true"] .n{background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg)}
.cat-reunion{color:var(--c-reunion)}
.reu{display:grid;gap:10px}
.reu section{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.reu section p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cat-ago{color:var(--c-ago)} .cat-travaux{color:var(--c-travaux)} .cat-intervention{color:var(--c-intervention)} .cat-signalement{color:var(--c-signalement)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn-ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{width:18px;height:18px;flex:none}
.btn-icon{padding:8px}

/* Grille principale */
.main{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);height:calc(100% - var(--toph,112px));min-height:0}
.pane{min-width:0;min-height:0;overflow:auto}
.list-pane{border-right:1px solid var(--line);background:var(--bg)}
.detail-pane{background:var(--surface);display:flex;flex-direction:column}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters-row{display:flex;gap:8px}
.filters-row>*{flex:1;min-width:0}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px}
textarea.field{resize:vertical;min-height:90px}
.search{position:relative}
.search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px}

.cards{display:flex;flex-direction:column;gap:8px;padding:12px 16px 24px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h3{font-size:1rem;line-height:1.3;font-weight:700}
.card p{margin:4px 0 0;color:var(--muted);font-size:.86rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:.78rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip-cat{background:color-mix(in srgb,currentColor 13%,transparent)}
.st{background:transparent;border:1px solid var(--line);color:var(--muted)}
.st-ouvert{color:var(--c-intervention);border-color:color-mix(in srgb,var(--c-intervention) 45%,transparent)}
.st-en_cours{color:var(--c-ago);border-color:color-mix(in srgb,var(--c-ago) 45%,transparent)}
.st-attente{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.st-resolu{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.st-clos{color:var(--muted)}
.urgent{background:var(--danger);color:#fff}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:1.05rem;margin-bottom:6px}

/* Détail */
.welcome{margin:auto;max-width:520px;padding:32px 24px;text-align:center}
.welcome h2{font-size:1.6rem;margin-bottom:10px}
.welcome ul{text-align:left;color:var(--muted);padding-left:20px;margin:16px 0 22px}
.dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.dhead-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dhead h2{font-size:1.4rem;line-height:1.2}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 16px}
.meta div{min-width:0}
.meta b{display:block;font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--ink)}
.dtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dtools select{width:auto}
.subtabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line)}
.subtab{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.back{display:none}

.thread{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.msg{display:flex;gap:10px;max-width:760px}
.msg img.av{width:32px;height:32px;border-radius:50%;flex:none}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 13px;min-width:0;flex:1}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.mine .bubble{border-radius:14px 4px 14px 14px;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.8rem;margin-bottom:3px}
.who b{font-size:.86rem}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.sys{align-self:center;font-size:.8rem;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 12px;text-align:center}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px}
.pj-img{display:block;padding:0;border:0;background:var(--surface-2);border-radius:9px;overflow:hidden;aspect-ratio:1;max-width:100%}
.pj-img img{width:100%;height:100%;object-fit:cover;display:block}
.pj-audio{margin-top:8px;display:grid;gap:4px}
.pj-audio audio,.pj-video video{width:100%;max-width:420px}
.pj-file{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink);max-width:420px}
.pj-file span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact{align-self:stretch;max-width:760px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c-ago);border-radius:10px;padding:11px 14px}
.contact .ic{grid-row:span 3;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c-ago) 14%,transparent);color:var(--c-ago)}
.contact-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.contact-h b{font-size:.95rem}
.when{font-family:var(--f-mono);font-size:.8rem;color:var(--ink);background:var(--surface-2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.contact .sub{font-size:.8rem;color:var(--muted)}
.contact .suite{font-size:.86rem;margin:4px 0 0;padding-top:6px;border-top:1px dashed var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.jtable{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.jtable th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.jtable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.jtable tr:last-child td{border-bottom:0}
.jwrap{overflow-x:auto}
.msg-del{border:0;background:transparent;color:var(--muted);font-size:.75rem;padding:0;margin-left:auto;text-decoration:underline}

.gallery{flex:1;overflow:auto;padding:18px 20px;background:var(--bg);display:grid;gap:22px;align-content:start}
.gallery section{display:grid;gap:10px}

.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.composer textarea{min-height:46px;max-height:180px;resize:none}
.comp-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.comp-row .send{margin-left:auto}
.pending{display:flex;gap:6px;flex-wrap:wrap}
.pend{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:8px;padding:4px 6px 4px 8px;font-size:.8rem;max-width:100%}
.pend img{width:30px;height:30px;object-fit:cover;border-radius:5px}
.pend span{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend button{border:0;background:transparent;padding:2px 4px;color:var(--muted)}
.rec-on{color:var(--danger);border-color:var(--danger)}
.note{font-size:.8rem;color:var(--muted)}

/* Fenêtres */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:14px}
.dialog h2{font-size:1.3rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid label{display:grid;gap:5px;min-width:0}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:grid;grid-template-rows:auto 1fr auto;color:#fff}
.lb-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.lb-bar button,.lb-nav button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 12px}
.lb-img{display:grid;place-items:center;min-height:0;padding:0 16px}
.lb-img img{max-height:100%;max-width:100%;object-fit:contain}
.lb-nav{display:flex;justify-content:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px)}
.gate{max-width:560px;margin:8vh auto;padding:28px 24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;gap:12px}
.gate h2{font-size:1.5rem}
.gate ol{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:6px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr)}
  .main[data-view="list"] .detail-pane{display:none}
  .main[data-view="detail"] .list-pane{display:none}
  .back{display:inline-flex}
  .brand small{display:none}
  .me span{display:none}
  .me{padding:3px}
  .form-grid{grid-template-columns:1fr}
  .dhead,.thread,.gallery{padding-left:16px;padding-right:16px}
  .subtabs{padding:0 12px}
}
@media (max-width:480px){ .top-new-label{display:none} }

/* ===== Refonte graphique : bandeau vert de la résidence, tuiles par rubrique ===== */
:root{--brand:#0F4D36;--brand-ink:#EEF7F2;--brand-soft:#E2F0E8;--lagoon:#0B7C86;--radius:14px}
body::before{background:var(--brand)}
.top{background:var(--brand);border-bottom:0;color:var(--brand-ink)}
.top-in{padding-block:14px}
.brand h1{color:#fff;font-size:1.2rem}
.brand small{color:color-mix(in srgb,var(--brand-ink) 70%,transparent)}
.brand-mark{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:11px}
.brand-mark .icon{color:#fff!important}
.top .btn-ghost{color:var(--brand-ink)}
.top .btn-ghost:hover{background:rgba(255,255,255,.1)}
.top .btn-primary{background:#fff;color:#0F4D36;border-color:#fff}
.top .btn-primary:hover{background:#E9F4EE}
.me{border-color:rgba(255,255,255,.25);color:var(--brand-ink)}
.me img{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.tabs{background:var(--brand);padding-bottom:14px}
.tab{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:var(--brand-ink);padding:7px 13px}
.tab:hover{background:rgba(255,255,255,.13)}
.tab span{color:inherit!important}
.tab .icon{width:16px;height:16px;opacity:.9}
.tab .n{background:rgba(255,255,255,.14);color:var(--brand-ink)}
.tab[aria-pressed="true"]{background:#fff;color:#0F4D36;border-color:#fff}
.tab[aria-pressed="true"] .n{background:#E2F0E8;color:#0F4D36}
.filters{border-bottom:0;padding-bottom:4px;padding-top:14px}
.stats{display:flex;flex-wrap:wrap;gap:6px;padding:2px 16px 6px}
.stat{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.78rem;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:.98rem;color:var(--ink)}
.stat.alert b{color:var(--danger)}
.cards{gap:10px;padding-top:6px}
.card{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:12px;row-gap:3px;border-radius:var(--radius);padding:14px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card[aria-current="true"]{background:var(--brand-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:none;transform:none}
.card .ctile{grid-row:1 / span 4;align-self:start}
.card > :not(.ctile){grid-column:2;min-width:0}
.card-top{margin:0}
.card-top .lbl{letter-spacing:.07em}
.card-when{margin-left:auto;font-size:.76rem;color:var(--muted);white-space:nowrap}
.card h3{font-size:1rem}
.card-foot{margin-top:6px}
.ctile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 13%,transparent);flex:none}
.ctile .icon{width:21px;height:21px}
.dhead{padding:22px 24px 16px;gap:14px}
.dtitle{display:flex;gap:14px;align-items:center}
.dtitle .ctile{width:50px;height:50px;border-radius:14px}
.dtitle .ctile .icon{width:24px;height:24px}
.dhead h2{font-size:1.55rem;line-height:1.2}
.meta{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dtools{border-top:1px solid var(--line);padding-top:12px}
.subtabs{background:var(--surface);padding:0 20px}
.subtab{padding:12px 14px}
.thread{padding:22px 24px;gap:12px}
.dayline{align-self:stretch;display:flex;align-items:center;gap:12px;max-width:760px;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-top:6px}
.dayline::before,.dayline::after{content:"";flex:1;height:1px;background:var(--line)}
.msg img.av{width:34px;height:34px}
.bubble{border-radius:4px 16px 16px 16px;box-shadow:0 1px 2px rgba(19,32,26,.05)}
.msg.mine .bubble{border-radius:16px 4px 16px 16px;background:var(--brand-soft)}
.contact{border-left:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(19,32,26,.05)}

.yr-body{display:grid}

.tdb-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:2px}
.tdb-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 2px;font:inherit;color:var(--ink);cursor:pointer}

.tdb-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

@media (max-width:640px){ .tdb{padding:14px 14px 22px} .tdb-stats{grid-template-columns:1fr 1fr} .tdb-m .muted{display:none} .tdb-pills .wl-sub{min-width:100%} }
/* Accueil compact, en haut de page */

.welcome-top .wtiles{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:0}
.welcome-top .wtile{padding:8px 10px;gap:10px;border-radius:12px}

@media (max-width:480px){ .welcome-top .wtiles{grid-template-columns:1fr 1fr} .welcome.welcome-top{padding:14px 14px 22px} }
.gate-wrap{display:grid;place-items:center;padding:28px 16px 40px}

.gate-art{background:var(--brand);color:var(--brand-ink);padding:34px;display:flex;flex-direction:column;gap:22px;justify-content:space-between}
.gate-art .lbl{color:color-mix(in srgb,var(--brand-ink) 70%,transparent)}
.gate-art h2{font-size:2rem;color:#fff;margin-top:6px}
.gate-art p{margin:0;color:color-mix(in srgb,var(--brand-ink) 82%,transparent)}

}

.cr-hint{border:1px dashed var(--line);border-radius:12px;padding:16px 18px;color:var(--muted);background:var(--surface)}
.synth-fold{padding:0;gap:0}
.synth-fold > summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none}
.synth-fold > summary::-webkit-details-marker{display:none}
.synth-fold > summary::before{content:"";width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none}
.synth-fold[open] > summary::before{transform:rotate(45deg)}
.synth-fold > summary .lbl{font-size:.9rem}
.synth-fold .fold-n{font-size:.8rem;color:var(--muted)}
.synth-fold .fold-hint{margin-left:auto;font-size:.82rem;font-weight:600;color:var(--accent)}
.synth-fold[open] .fold-hint{display:none}
.synth-fold > .synth-b{padding:0 16px 16px}
/* Couleurs des rubriques de synthèse : fond très clair, titre foncé, texte noir */
.synth-sec.tone-red{background:#FDF1EF;border-color:#F2C6C0}
.synth-sec.tone-red h4{color:#A3261E}
.synth-sec.tone-red li::marker{color:#A3261E}
.synth-sec.tone-amber{background:#FFF6E6;border-color:#F0D6A6}
.synth-sec.tone-amber h4{color:#8A5300}
.synth-sec.tone-amber li::marker{color:#B36B00}
.synth-sec.tone-green{background:#EEF7F1;border-color:#BFDCCB}
.synth-sec.tone-green h4{color:#17694A}
.synth-sec.tone-blue{background:#EEF4FB;border-color:#C5D7EE}
.synth-sec.tone-blue h4{color:#1F5FA8}
.synth-sec.tone-blue li::marker{color:#1F5FA8}
.synth-sec.tone-violet{background:#F4F0FA;border-color:#D8CCEC}
.synth-sec.tone-violet h4{color:#5B3C99}
.synth-sec.tone-violet li::marker{color:#5B3C99}
.synth-fold.tone-red{background:#FDF1EF;border-color:#F2C6C0}
.synth-fold.tone-red > summary .lbl,.synth-fold.tone-red .fold-hint{color:#A3261E}
.synth-fold.tone-red > summary::before{border-color:#A3261E}
.synth-fold.tone-blue{background:#EEF4FB;border-color:#C5D7EE}
.synth-fold.tone-blue > summary .lbl,.synth-fold.tone-blue .fold-hint{color:#1F5FA8}
.synth-fold.tone-blue > summary::before{border-color:#1F5FA8}
.synth-fold.tone-amber{background:#FFF6E6;border-color:#F0D6A6}
.synth-fold.tone-amber > summary .lbl,.synth-fold.tone-amber .fold-hint{color:#8A5300}
.synth-fold.tone-amber > summary::before{border-color:#8A5300}
.synth-sec h4{display:flex;align-items:center;gap:6px}
.synth-sec h4::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.head-fold{border:1px solid var(--line);border-radius:12px;background:#F3F8F5}
.head-fold > summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
.head-fold > summary::-webkit-details-marker{display:none}
.head-fold > summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none}
.head-fold[open] > summary::before{transform:rotate(45deg)}
.head-fold > summary .lbl{color:var(--accent)}
.head-fold .fold-hint{margin-left:auto;font-size:.82rem;font-weight:600;color:var(--accent)}
.head-fold[open] .fold-hint{display:none}
.head-fold-b{padding:0 12px 12px}
.head-fold-b .synth{border:0;background:transparent;padding:0}
/* Rubriques repliées, comme les années de la liste */
.sec-fold > summary h4.ech-t{text-transform:none;letter-spacing:0;font-size:.88rem;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ech-txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem;line-height:1.55;margin-bottom:8px}
.synth-fold.tone-violet{background:#F4F0FA;border-color:#D8CCEC}
.synth-fold.tone-violet > summary .lbl,.synth-fold.tone-violet .fold-hint{color:#5B3C99}
.synth-fold.tone-violet > summary::before{border-color:#5B3C99}
.synth-fold.tone-green{background:#EEF7F1;border-color:#BFDCCB}
.synth.synth-fold{padding:0}
details.synth-sec.sec-fold{padding:0}
.synth-fold > summary{flex-wrap:wrap}
.synth-fold > summary .lbl{min-width:0;overflow-wrap:anywhere}
.synth-fold > .synth-b{grid-template-columns:minmax(0,1fr);gap:6px}
.sec-fold{padding:0}
.sec-fold > summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
.sec-fold > summary::-webkit-details-marker{display:none}
.sec-fold > summary h4{margin:0;font-size:.86rem}
.sec-fold > summary h4::before{display:none}
.sec-chev{width:16px;height:16px;flex:none;transition:transform .15s}

@media (max-width:640px){ .synth-fold > .synth-b{padding:0 8px 10px} .sec-fold > summary{padding:9px 10px} .sec-fold .sec-body{padding:0 10px 10px 12px} .agpage{padding-left:10px;padding-right:10px} }
.sec-fold.tone-red .sec-chev{color:#A3261E}.sec-fold.tone-amber .sec-chev{color:#8A5300}.sec-fold.tone-green .sec-chev{color:#17694A}.sec-fold.tone-blue .sec-chev{color:#1F5FA8}.sec-fold.tone-violet .sec-chev{color:#5B3C99}
/* ===== Historique des échanges ===== */
.hist-filters{display:grid;gap:8px;margin-top:6px}
.hist-filters .agidx{margin-top:0}
.hist-filters .field{max-width:420px}
.hist-list{display:grid;gap:6px}
.hist-month{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.hist-item{border:1px solid var(--line);border-radius:12px;background:var(--surface);border-left:4px solid #9CC7B2}
.hist-item.out{border-left-color:#1F5FA8}
.hist-item > summary{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);gap:10px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none}
.hist-item > summary::-webkit-details-marker{display:none}
.hist-item[open]{box-shadow:0 1px 6px rgba(0,0,0,.06)}
.hist-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--accent)}
.hist-item.out .hist-ic{color:#1F5FA8;background:#EEF4FB}
.hist-ic .icon{width:16px;height:16px}
.hist-when{display:grid;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums;line-height:1.2}
.hist-when small{font-weight:400;color:var(--muted);font-size:.75rem}
.hist-t{display:grid;gap:1px;min-width:0}
.hist-t b{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-t small{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-b{display:grid;gap:8px;padding:0 14px 12px 52px}
.hist-b audio{width:100%;max-width:420px}
@media (max-width:640px){ .hist-item > summary{grid-template-columns:auto minmax(0,1fr);} .hist-item > summary .hist-ic,.hist-item > summary .chip{display:none} .hist-b{padding:0 12px 12px} }
.hist-cat{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.hist-cat > summary{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;list-style:none;font-size:1rem}
.hist-cat > summary::-webkit-details-marker{display:none}
.hist-cat > summary .ctile{width:34px;height:34px;border-radius:10px}
.hist-cat[open] > summary{border-bottom:1px solid var(--line)}
.hist-n{margin-left:auto;font-size:.8rem;color:var(--muted)}
.hist-cat-b{display:grid;gap:6px;padding:10px}
.hist-year{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.hist-year > summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none}
.hist-year > summary::-webkit-details-marker{display:none}
.hist-year[open] > summary{background:var(--accent-soft);border-radius:12px 12px 0 0}
.hist-year[open] .yr-chev{transform:rotate(90deg)}
.hist-year-b{display:grid;gap:6px;padding:8px}
.hist-sub{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface)}
.hist-sub.tone-blue{border-left-color:#3b6fb6}.hist-sub.tone-red{border-left-color:#c0504d}.hist-sub.tone-green{border-left-color:#2e7d5b}
.hist-sub > summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;font-size:.97rem}
.hist-sub > summary::-webkit-details-marker{display:none}
.hist-sub[open] > summary{border-bottom:1px solid var(--line)}
.hist-sub[open] > summary .yr-chev{transform:rotate(90deg)}
.hist-sub-b{display:grid;gap:6px;padding:8px}
/* ===== Paramétrage ===== */
.pr-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.pr-row:first-of-type{border-top:0}
.pr-t{display:grid;gap:3px;min-width:0}
.pr-t small{color:var(--muted);font-size:.86rem;line-height:1.45}
.pr-a{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}

@media (max-width:640px){ .pr-row{grid-template-columns:auto minmax(0,1fr)} .pr-a{grid-column:1/-1;justify-content:flex-start} }
/* ===== Mise à jour Gmail ===== */
.gm-contacts{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface-2)}
.gm-contacts summary{cursor:pointer;font-weight:600;font-size:.9rem}

.gm-atts{display:grid;gap:3px;font-size:.84rem}

.gm-dos{display:grid;gap:3px;max-width:520px}
/* ===== Pages chantier, avocat, huissier ===== */
.tab-page{border-style:dashed}
.pg-ech{border-top:1px solid var(--line);padding:10px 0 2px;display:grid;gap:4px}

.agpage{width:100%;max-width:1320px;margin:0 auto;padding:22px clamp(16px,3vw,36px) 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}

.agpage-h{display:grid;gap:6px}
.agpage-h h2{font-size:1.6rem;margin:0}
.agpage-h p{margin:0}
.agidx{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.agidx .chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;font-size:.82rem;cursor:pointer}
.agidx .chip:hover{border-color:var(--accent);color:var(--accent)}
.agidx .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.agdocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:6px 10px}

.agdocs .pj-file{margin-top:0}
.agdocs .pj-file{max-width:none}
.agoall{display:flex;gap:12px;align-items:center;width:calc(100% - 32px);margin:12px 16px 4px;padding:12px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:14px;background:var(--accent-soft);text-align:left;color:var(--ink);cursor:pointer}
.agoall span{display:grid;gap:2px}
.agoall small{color:var(--muted)}

/* ===== Synthèse des procès-verbaux d'AG ===== */
.synth{background:#F3F8F5;border:1px solid var(--line);border-left:0;border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.synth .lbl{color:var(--accent)}
.synth-b{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px;font-size:.97rem;line-height:1.6}
.synth-sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.synth-sec.wide{grid-column:1/-1}
.synth-sec h4{margin:0 0 4px;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.synth-sec p{margin:0;overflow-wrap:anywhere}
.synth-sec ul{margin:0;padding-left:18px;display:grid;gap:4px}
.synth-sec li{overflow-wrap:anywhere}
.synth-sec li::marker{color:var(--accent)}
.synth{min-width:0;grid-template-columns:minmax(0,1fr)}
.synth-b div{overflow-wrap:anywhere}
.synth-h{font-weight:700;margin-top:8px;color:var(--ink)}
.synth-b > .synth-h:first-child{margin-top:0}
/* ===== Version claire et simple ===== */
:root{color-scheme:light;--bg:#F5F7F5;--surface:#FFFFFF;--surface-2:#EEF3EF;--line:#DCE4DF;--ink:#16211B;--muted:#5C6B63;--accent:#17694A;--accent-soft:#E3F1E9;--brand-soft:#E8F3EC}
body::before{background:#fff}
.top{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(22,33,27,.04)}
.brand h1{color:var(--ink)}
.brand small{color:var(--muted)}
.brand-mark{background:var(--accent);border:0}
.top .btn-ghost{color:var(--ink)}
.top .btn-ghost:hover{background:var(--surface-2)}
.top .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.top .btn-primary:hover{background:#125A3F}
.me{border-color:var(--line);color:var(--ink)}
.me img{box-shadow:none}
.tabs{background:#fff;padding-bottom:12px}
.tab{background:var(--bg);border-color:var(--line);color:var(--ink)}
.tab:hover{background:var(--surface-2)}
.tab .n{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tab[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab[aria-pressed="true"] .n{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.card{box-shadow:none}
.card:hover{transform:none;box-shadow:0 2px 10px rgba(22,33,27,.06)}
.card p{-webkit-line-clamp:1}
.search input{font-size:1rem;padding-top:11px;padding-bottom:11px;border-radius:12px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hits{display:grid;gap:6px;padding:0 16px 8px}
.hits-h{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 2px 2px}
.hit{display:grid;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit b{font-size:.9rem}
.hit small{color:var(--muted);font-size:.78rem}
.hit span{font-size:.86rem;color:var(--ink);overflow-wrap:anywhere}
mark{background:#FFE9A8;color:inherit;border-radius:3px;padding:0 1px}
.gate-art{background:var(--accent-soft);color:var(--ink)}
.gate-art h2{color:var(--ink)}
.gate-art p,.gate-art .lbl{color:var(--muted)}
.gate-art svg.art path{stroke:var(--accent)}
.gate-art svg.art text{fill:var(--accent)}
</style>
</head>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CFG = window.ILE_VERTE_CONFIG || {};
const AUTH_HASH = location.hash;
const sb = (window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey && !/VOTRE|XXXX/.test(CFG.supabaseUrl + CFG.supabaseAnonKey))
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const WANT_DEMO = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]demo\b/.test(location.search);
let DEMO = null;

const CATS = {
  ago:          {label:"AGO",            long:"Assemblées générales",        pfx:"AGO"},
  travaux:      {label:"Travaux",        long:"Dossiers travaux",            pfx:"TRX"},
  intervention: {label:"Interventions",  long:"Demandes d'intervention",     pfx:"INT"},
  signalement:  {label:"Signalements",   long:"Signalements de problème",    pfx:"SIG"},
  reunion:      {label:"Réunions",       long:"Comptes rendus de réunion",   pfx:"CR"},
};
const TYPES_REU = ["Réunion du conseil syndical","Réunion avec le syndic","Réunion avec l'entreprise","Réunion de chantier / visite sur place","Réunion avec le maître d'œuvre","Réunion avec un expert, un huissier ou un avocat","Autre réunion"];
const STATUTS = {ouvert:"Ouvert", en_cours:"En cours", attente:"En attente syndic / entreprise", resolu:"Résolu", clos:"Clos"};
const CANAUX = {
  appel:   {label:"Appel téléphonique", ic:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'},
  message: {label:"Message (SMS, WhatsApp)", ic:'<path d="M4 5h16v11H8l-4 4z"/>'},
  email:   {label:"E-mail", ic:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'},
  courrier:{label:"Courrier / recommandé", ic:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>'},
  rdv:     {label:"Rendez-vous / visite sur place", ic:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'},
};
const SENS = {sortant:"Passé par le conseil", entrant:"Reçu par le conseil"};
const ORGAS = ["Syndic Nouméa Immobilier","Entreprise COSTENTIN","Maître d'œuvre","Huissier","Assurance","Copropriétaire","Locataire","Mairie"];
const BATS = ["Bâtiment A","Bâtiment B","Bâtiment C","Bâtiment D","Bâtiment E","Bâtiment F","Parties communes","Toute la résidence"];

const I = {
  photo:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6l1.5-2h5L16 6"/><circle cx="12" cy="13" r="3.5"/></svg>',
  audio:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  doc:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  dict:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/></svg>',
  send:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-6 16-3-7z"/></svg>',
  back:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  edit:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  link:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
};

const S = {
  db:null, user:null, assets:null, dict:null,
  me:null, owner:false, editor:false, canWrite:true,
  dossiers:[], loaded:false, membres:{}, prof:{},
  f:{cat:"tous", bat:"", st:"", q:""},
  cur:null, msgs:[], openYrs:new Set(), page:null, pdata:{}, agoMsgs:null, unsubMsgs:null, sub:"fil", pend:[], sending:false, audioCtx:null,
};

/* ---------- utilitaires ---------- */
const fmtDate = t => t ? new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}) : "";
const fmtDT = t => t ? new Date(t).toLocaleString("fr-FR",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const fmtJour = t => t ? new Date(t).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) : "";
const fmtHeure = t => t ? new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":","h") : "";
const icon = path => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
const ICS = {
  tous:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h8M8 16h5"/>',
  ago:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3 3 0 0 1 0 5.6M21 20c0-2.6-1.6-4.8-3.8-5.6"/>',
  travaux:'<path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
  intervention:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  signalement:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  reunion:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4"/>'
};
const catIcon = c => icon(ICS[c]||ICS.tous);
const catTile = c => `<span class="ctile cat-${esc(c)}" aria-hidden="true">${catIcon(c)}</span>`;
const AV_COLORS = ["#17694A","#0B7C86","#7A3E8F","#9C5C07","#4B4FB5","#B3312A","#3F6F2A"];
const avColor = id => { const s=String(nameOf(id)); let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))|0; return AV_COLORS[Math.abs(h)%AV_COLORS.length]; };
const ART = `<svg class="art" viewBox="0 0 320 150" fill="none" aria-hidden="true">
  ${["A","B","C","D","E","F"].map((l,i)=>{ const x=10+i*52; return `<path d="M${x} 118V70l20-17 20 17v48z" fill="#fff" stroke="#17694A" stroke-width="1.5" stroke-linejoin="round"/><path d="M${x+8} 80h8M${x+24} 80h8M${x+8} 94h8M${x+24} 94h8" stroke="#9CC7B2" stroke-width="3" stroke-linecap="round"/><text x="${x+20}" y="112" fill="#17694A" font-family="sans-serif" font-size="10" text-anchor="middle">${l}</text>`; }).join("")}
  <path d="M0 130q20-7 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0" stroke="#0B7C86" stroke-width="2"/>
  <path d="M0 142q20-7 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0" stroke="#9FD3D8" stroke-width="2"/>
</svg>`;
const qui = m => [m.qui, m.organisme].filter(Boolean).join(" · ") || "Interlocuteur non précisé";
const fmtRel = t => {
  if(!t) return ""; const d = (Date.now()-t)/1000;
  if(d<60) return "à l'instant"; if(d<3600) return `il y a ${Math.floor(d/60)} min`;
  if(d<86400) return `il y a ${Math.floor(d/3600)} h`; if(d<86400*7) return `il y a ${Math.floor(d/86400)} j`;
  return fmtDate(t);
};
const fmtSize = b => b>1e6 ? (b/1e6).toFixed(1).replace(".",",")+" Mo" : Math.max(1,Math.round(b/1e3))+" Ko";
const fmtDur = s => s ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}` : "";
const refOf = d => `${CATS[d.cat]?.pfx||"DOS"}-${new Date(d.creeLe||Date.now()).toISOString().slice(2,10).replace(/-/g,"")}`;
const URLS = {}; const NEED = new Set(); let urlTimer = null;
const blobUrl = path => {
  const c = URLS[path]; if (c && c.exp > Date.now()) return c.url;
  NEED.add(path); clearTimeout(urlTimer); urlTimer = setTimeout(fetchUrls, 30); return "";
};
async function fetchUrls(){
  const paths=[...NEED]; NEED.clear(); if(!paths.length||!sb) return;
  const {data,error}=await sb.storage.from("pieces").createSignedUrls(paths, 3600);
  if(error||!data) return;
  let n=0; data.forEach(x=>{ if(x.signedUrl&&x.path){ URLS[x.path]={url:x.signedUrl,exp:Date.now()+3300e3}; n++; } });
  if(n) document.querySelectorAll("[data-path]").forEach(el=>{ const c=URLS[el.dataset.path]; if(c){ if(el.tagName==="IMG") el.src=c.url; else el.href=c.url; } });
  if(n && S.cur && $("#dhead")){ renderThread(); renderGallery(); renderJournal(); }
}
const ts = v => v ? new Date(v).getTime() : null;
const iso = n => n ? new Date(n).toISOString() : null;
function rowToDossier(r){ return {id:r.id, cat:r.cat, titre:r.titre, batiment:r.batiment||"", statut:r.statut||"ouvert", priorite:r.priorite||"normale",
  dateRef:r.date_ref||"", intervenant:r.intervenant||"", reference:r.reference||"", description:r.description||"", reunion:r.reunion||null,
  auteur:r.auteur||(r.auteur_nom?"nom:"+r.auteur_nom:null), creeLe:ts(r.cree_le), majLe:ts(r.maj_le), dernier:r.dernier||null}; }
function rowToMsg(r){ return {id:r.id, type:r.type, auteur:r.auteur||(r.auteur_nom?"nom:"+r.auteur_nom:null), texte:r.texte||"", pieces:r.pieces||[],
  creeLe:ts(r.cree_le), canal:r.canal, sens:r.sens, quand:ts(r.quand), duree:r.duree, qui:r.qui, organisme:r.organisme, tel:r.tel, suite:r.suite, de:r.de, a:r.a}; }
function dossierToRow(b){
  const map={cat:"cat",titre:"titre",batiment:"batiment",statut:"statut",priorite:"priorite",dateRef:"date_ref",intervenant:"intervenant",reference:"reference",description:"description",reunion:"reunion",dernier:"dernier"};
  const o={}; for(const k in b){ if(k in map) o[map[k]] = (k==="dateRef" && !b[k]) ? null : b[k]; else if(k==="majLe") o.maj_le=iso(b[k]); }
  return o;
}
function msgToRow(b, dossierId){ return {dossier_id:dossierId, type:b.type||null, auteur:S.me, auteur_nom:nameOf(S.me), texte:b.texte||null, pieces:b.pieces||[],
  cree_le:iso(b.creeLe||Date.now()), canal:b.canal||null, sens:b.sens||null, quand:b.quand?iso(b.quand):null, duree:b.duree??null, qui:b.qui||null,
  organisme:b.organisme||null, tel:b.tel||null, suite:b.suite||null, de:b.de||null, a:b.a||null}; }
async function dbUpdateDossier(id, patch){ const {error}=await sb.from("dossiers").update(dossierToRow(patch)).eq("id",id); if(error) throw error; }
async function dbAddMsg(dossierId, body){ const {error}=await sb.from("messages").insert(msgToRow(body,dossierId)); if(error) throw error; }
async function loadDossiers(){
  if(DEMO){ S.loaded=true; renderAll(true); return; }
  const {data,error}=await sb.from("dossiers").select("*").order("maj_le",{ascending:false}).limit(1000);
  S.loaded=true;
  if(error){ toast("Impossible de lire les dossiers."); renderAll(); return; }
  S.dossiers=data.map(rowToDossier);
  if(S.cur && !S.dossiers.some(d=>d.id===S.cur)){ closeDossier(); return; }
  renderAll(true);
}
async function loadMembres(){
  if(DEMO) return;
  const {data}=await sb.from("membres").select("*"); const m={}; (data||[]).forEach(x=>m[x.id]=x); S.membres=m; updateMe();
  if(S.loaded) renderAll(true);
}
async function loadMsgs(id=S.cur){
  if(!id) return;
  if(DEMO){ S.msgsLoaded=true; S.msgs=(DEMO.msgs[id]||[]).slice().sort((a,b)=>(a.creeLe||0)-(b.creeLe||0)); renderSubtabs(); renderThread(); renderGallery(); renderJournal(); return; }
  const {data,error}=await sb.from("messages").select("*").eq("dossier_id",id).order("cree_le",{ascending:true}).limit(2000);
  if(S.cur!==id) return;
  S.msgsLoaded=true;
  if(error){ renderThread(); toast("Impossible de lire les messages de ce dossier."); return; }
  S.msgs=data.map(rowToMsg);
  renderSubtabs(); renderThread(); renderGallery(); renderJournal();
}
function subscribeMsgs(id){
  if(DEMO) return ()=>{};

const normTxt=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function toneOf(h){
  const t=normTxt(h||"");
  if(/termite/.test(t)) return "tone-red";
  if(/doute|verifier|attendu|manque|vigilance|reserve/.test(t)) return "tone-amber";
  if(/conclusion|decision|retenir|ce que dit|signature|montant|garantie/.test(t)) return "tone-green";
  if(/^bat|batiment|logement|log\.|reception|avancement/.test(t)) return "tone-blue";
  if(/chronologie|historique|sources|participation|bureau|lieu/.test(t)) return "tone-violet";
  return "";
}
function synthSections(lines, headOf, foldItems){
  const secs=[]; let cur=null;
  for(const l of lines){ if(!String(l).trim()) continue; const m=headOf(l);
    if(m){ cur={h:m[1],items:[]}; secs.push(cur); if(m[2]&&m[2].trim()) cur.items.push(m[2]); }
    else { if(!cur){ cur={h:"",items:[]}; secs.push(cur); } cur.items.push(l); } }
  return secs.map(x=>{
    let its=x.items.map(t=>String(t).replace(/^\s*[-•]\s*/,"").trim()).filter(Boolean);
    if(its.length===1 && its[0].length>160){
      const parts=its[0].split(/\s*;\s+|(?<=[a-zàâçéèêëîïôûù»)\d]\.)\s+(?=[A-ZÉÈÀÂÎÔÇ«])/).map(t=>t.trim().replace(/[;.]$/,"")).filter(Boolean);
      if(parts.length>1) its=parts.map(t=>t.charAt(0).toUpperCase()+t.slice(1)+".");
    }
    const len=its.join(" ").length;
    const body=its.length>1?`<ul>${its.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:(its[0]?`<p>${esc(its[0])}</p>`:"");
    if(foldItems && x.h) return `<details class="synth-sec sec-fold ${toneOf(x.h)}"><summary><svg class="icon sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg><h4>${esc(x.h)}</h4></summary><div class="sec-body">${body}</div></details>`;
    return `<div class="synth-sec${len>380?" wide":""} ${toneOf(x.h)}">${x.h?`<h4>${esc(x.h)}</h4>`:""}${body}</div>`; }).join("");
}
function synthBlock(text,label,fold){
  if(fold){ const b=synthSections(String(text||"").split("\n"), l=>l.match(/^([A-ZÉÈÀÂÎÔÛÇ][^:–]{1,40}?)\s*:\s*(.*)$/), true);
    const n=(b.match(/class="synth-sec/g)||[]).length;
    return `<details class="synth synth-fold ${toneOf(label)}"><summary><span class="lbl">${esc(label)}</span><span class="fold-n">${n} rubrique${n>1?"s":""}</span><span class="fold-hint">Dérouler</span></summary><div class="synth-b">${b}</div></details>`; }
  const body=synthSections(String(text||"").split("\n"), l=>l.match(/^([A-ZÉÈÀÂÎÔÛÇ][^:–]{1,40}?)\s*:\s*(.*)$/));
  return `<section class="synth"><span class="lbl">${esc(label)}</span><div class="synth-b">${body}</div></section>`;
}
function pieceLink(p,extra){
  return `<a class="pj-file" data-path="${esc(p.id)}" href="${blobUrl(p.id)||"#"}" target="_blank" rel="noopener">${p.kind==="image"?I.photo:I.doc}<span>${esc(p.nom||"Document")}</span>${extra?`<span class="muted" style="margin-left:auto;flex:none;font-size:.8rem">${esc(extra)}</span>`:""}</a>`;

async function loadPage(k){
  const P=PAGES[k]; S.pdata[k]={loading:true};
  await Promise.resolve();
  let msgs=[];
  if(DEMO){ msgs=Object.entries(DEMO.msgs).flatMap(([did,ms])=>ms.map(m=>({...m,dossierId:did}))); }
  else {
    const qs=[sb.from("messages").select("*").eq("dossier_id",P.anchor).order("cree_le",{ascending:true}).limit(2000)];
    if(P.kw){
      qs.push(sb.from("messages").select("*").or(P.kw.map(w=>`texte.ilike.*${w}*`).join(",")).limit(800));
      qs.push(sb.from("messages").select("id,dossier_id,type,pieces,cree_le,quand,qui,organisme").limit(5000));
    }
    const rs=await Promise.all(qs);
    if(rs.some(r=>r.error)) toast("Lecture incomplète des messages.");
    const seen=new Set();
    rs.forEach(r=>(r.data||[]).forEach(row=>{ if(seen.has(row.id)) return; seen.add(row.id); msgs.push({...rowToMsg(row),dossierId:row.dossier_id}); }));
  }
  const hit=t=>!!P.kw && P.kw.some(w=>normTxt(t).includes(normTxt(w)));
  msgs=msgs.filter(m=>m.dossierId===P.anchor || hit(m.texte) || (m.pieces||[]).some(p=>hit(p.nom)));
  msgs.sort((a,b)=>(b.quand||b.creeLe||0)-(a.quand||a.creeLe||0));
  S.pdata[k]={msgs};
  if(S.page===k && !S.cur) renderDetail();
}

async function loadAgoMsgs(ids){
  S.agoReq=true;
  await Promise.resolve();
  const o={}; ids.forEach(id=>o[id]=[]);
  if(DEMO){ ids.forEach(id=>o[id]=DEMO.msgs[id]||[]); }
  else if(ids.length){
    const {data,error}=await sb.from("messages").select("id,dossier_id,type,pieces,cree_le").in("dossier_id",ids).order("cree_le",{ascending:true}).limit(3000);
    if(error) toast("Impossible de lire les documents des assemblées.");

}

/* ---------- pièces jointes ---------- */
async function prepareImage(file){
  const okType=/^image\/(jpeg|png|webp|gif)$/.test(file.type);
  if(file.type==="image/gif" || (okType && file.size<1.2e6)) return {blob:file,type:file.type};
  let bmp; try{ bmp=await createImageBitmap(file); }catch(e){ if(okType) return {blob:file,type:file.type}; throw new Error("Format de photo non pris en charge"); }
  const max=2000, k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
  return {blob,type:"image/jpeg"};
}
function audioKind(file){
  const t=(file.type||"").toLowerCase(), n=file.name.toLowerCase();
  if(/(mp4|m4a)/.test(t) || /\.(m4a|mp4)$/.test(n)) return "mp4";
  if(/webm/.test(t) || n.endsWith(".webm")) return "webm";
  return "other";
}
async function audioDuration(blob){
  return new Promise(res=>{ const a=new Audio(); const u=URL.createObjectURL(blob); a.preload="metadata"; a.src=u;
    a.onloadedmetadata=()=>{ const d=isFinite(a.duration)?a.duration:0; URL.revokeObjectURL(u); res(d); }; a.onerror=()=>{URL.revokeObjectURL(u);res(0);}; setTimeout(()=>res(0),4000); });
}
async function transcode(file, onProg){
  const ctx = S.audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  S.audioCtx = ctx;
  const buf = await ctx.decodeAudioData(await file.arrayBuffer());
  if(buf.duration>900) throw new Error("Audio trop long (15 min maximum)");
  if(typeof MediaRecorder==="undefined") throw new Error("Conversion audio impossible sur cet appareil");
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime) throw new Error("Conversion audio impossible sur cet appareil");
  await ctx.resume();
  const dest=ctx.createMediaStreamDestination();
  const src=ctx.createBufferSource(); src.buffer=buf; src.connect(dest);
  const rec=new MediaRecorder(dest.stream,{mimeType:mime,audioBitsPerSecond:48000});
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const stopped=new Promise(r=>rec.onstop=r);
  const ended=new Promise(r=>src.onended=r);
  rec.start(1000); const t0=ctx.currentTime; src.start();
  const iv=setInterval(()=>onProg&&onProg(Math.min(99,Math.round((ctx.currentTime-t0)/buf.duration*100))),500);
  await ended; clearInterval(iv); rec.stop(); await stopped;
  const type = mime.startsWith("audio/mp4") ? "audio/mp4" : "audio/webm";
  return {blob:new Blob(chunks,{type}), type, duree:buf.duration};
}
function addFiles(files, kind){
  [...files].forEach(f=>{
    let k=kind;
    if(kind==="doc") k = f.type==="application/pdf"||/\.pdf$/i.test(f.name) ? "pdf" : (/^video\//.test(f.type)?"video":null);
    if(!k){ toast(`« ${f.name} » : seuls les PDF et vidéos MP4/WebM sont acceptés.`); return; }
    if(f.size>60e6){ toast(`« ${f.name} » est trop lourd.`); return; }
    const item={file:f,kind:k,label:f.name,state:""};
    if(k==="image"){ try{ item.preview=URL.createObjectURL(f);}catch(e){} }
    S.pend.push(item);
  });
  renderPending();
}
const MIME = {mp3:"audio/mpeg",m4a:"audio/mp4",mp4:"audio/mp4",aac:"audio/aac",webm:"audio/webm",wav:"audio/wav",ogg:"audio/ogg",opus:"audio/ogg"};
async function uploadOne(item){
  let blob=item.file, type=item.file.type, extra={};
  if(item.kind==="image"){ const r=await prepareImage(item.file); blob=r.blob; type=r.type; }
  else if(item.kind==="audio"){
    const t=(item.file.type||"").toLowerCase(), n=(item.file.name||"").toLowerCase();
    const ext=(n.match(/\.([a-z0-9]+)$/)||[])[1]||"";
    const playable=/(mpeg|mp3|mp4|m4a|aac|webm|wav|ogg|opus)/.test(t) || (ext in MIME);
    if(playable){ type = t || MIME[ext]; extra.duree = item.duree || await audioDuration(item.file); }
    else { item.state="conversion…"; renderPending(); const r=await transcode(item.file,p=>{item.state=`conversion ${p} %`;renderPending();}); blob=r.blob; type=r.type; extra.duree=r.duree; }
  }
  else if(item.kind==="pdf") type="application/pdf";
  else if(item.kind==="video") type = /webm/.test(type) ? "video/webm" : "video/mp4";
  if(blob.size>50*1024*1024) throw new Error(`« ${item.label} » dépasse 50 Mo.`);
  item.state="envoi…"; renderPending();
  let ext=(item.label.match(/\.([a-z0-9]{1,5})$/i)||[])[1]||({image:"jpg",audio:"webm",pdf:"pdf",video:"mp4"})[item.kind];
  if(item.kind==="image" && type==="image/jpeg") ext="jpg";
  if(item.kind==="audio" && !item.label.match(/\.[a-z0-9]{1,5}$/i)) ext = /mp4/.test(type) ? "m4a" : "webm";
  const path=`${S.cur||"divers"}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext.toLowerCase()}`;
  const {error}=await sb.storage.from("pieces").upload(path, blob, {contentType:type||"application/octet-stream", upsert:false});
  if(error) throw new Error(/size|large|exceed/i.test(error.message||"") ? `« ${item.label} » est trop lourd.` : `Échec de l'envoi de « ${item.label} ».`);
  item.state="✓"; renderPending();
  return {id:path, kind:item.kind, nom:item.label, taille:blob.size, ...extra};
}

/* ---------- enregistrement au micro ---------- */
const REC={rec:null,chunks:[],t0:0,iv:null};
function setRecBtn(btn,on){ if(!btn||!btn.isConnected) return; btn.classList.toggle("rec-on",on); const s=btn.querySelector("span"); if(s) s.textContent = on ? "Arrêter "+fmtDur(Math.max(1,(Date.now()-REC.t0)/1000)) : (btn.dataset.label||"Enregistrer"); }
async function toggleRec(btn, onDone){
  if(REC.rec){ REC.rec.stop(); return; }
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==="undefined"){ toast("L'enregistrement n'est pas disponible sur cet appareil : joignez un fichier audio."); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast("Le micro est refusé : autorisez le micro pour ce site dans les réglages du navigateur."); return; }
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported(m))||"";
  const rec=new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
  REC.rec=rec; REC.chunks=[]; REC.t0=Date.now();
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) REC.chunks.push(e.data); };
  rec.onstop=()=>{
    clearInterval(REC.iv); stream.getTracks().forEach(tr=>tr.stop());
    const type=(rec.mimeType||mime||"audio/webm").split(";")[0];
    const ext=/mp4/.test(type)?"m4a":"webm"; const dur=(Date.now()-REC.t0)/1000; const d=new Date(); const p=x=>String(x).padStart(2,"0");
    const f=new File(REC.chunks,`vocal-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}h${p(d.getMinutes())}.${ext}`,{type});
    REC.rec=null; setRecBtn(btn,false);
    if(f.size) onDone(f,dur);
  };
  rec.start(1000); setRecBtn(btn,true);
  REC.iv=setInterval(()=>setRecBtn(btn,true),500);
}

/* ---------- écriture ---------- */
async function envoyer(){
  if(S.sending||!S.db||!S.cur) return;
  const ta=$("#msgTxt"); const texte=(ta?.value||"").trim();
  if(!texte && !S.pend.length){ ta?.focus(); return; }
  const id=S.cur;
  S.sending=true; setSendBusy(true);
  try{
    const pieces=[];
    for(const it of S.pend){
      try{ pieces.push(await uploadOne(it)); }
      catch(e){ throw new Error(e.message||`Échec de l'envoi de « ${it.label} »`); }
    }
    const now=Date.now();
    await dbAddMsg(id, {texte, creeLe:now, pieces});
    const resume = texte ? texte.slice(0,160) : resumePieces(pieces);
    await dbUpdateDossier(id, {majLe:now, dernier:{texte:resume, auteur:S.me, le:now}});
    refreshCur();
    S.pend.forEach(p=>p.preview&&URL.revokeObjectURL(p.preview)); S.pend=[];
    if(ta){ ta.value=""; autoGrow(ta); } try{ localStorage.removeItem("brouillon-"+id);}catch(e){}
    S.scrollToEnd=true;
  }catch(e){ toast(e.message||"Le message n'a pas pu être envoyé. Réessayez."); S.pend.forEach(p=>{ if(p.state!=="✓") p.state=""; }); }
  S.sending=false; setSendBusy(false); renderPending();
}
function resumePieces(p){
  const n=k=>p.filter(x=>x.kind===k).length; const parts=[];
  if(n("image")) parts.push(`${n("image")} photo${n("image")>1?"s":""}`);
  if(n("audio")) parts.push("message vocal"); if(n("pdf")) parts.push("document PDF"); if(n("video")) parts.push("vidéo");
  return parts.join(", ");
}
function setSendBusy(b){ const s=document.querySelector('[data-act="send"]'); if(s){ s.disabled=b; s.querySelector("span").textContent=b?"Envoi…":"Envoyer"; } }
async function changeStatut(v){
  const d=S.dossiers.find(x=>x.id===S.cur); if(!d||d.statut===v) return;
  try{
    const now=Date.now();
    await dbUpdateDossier(d.id, {statut:v, majLe:now});
    await dbAddMsg(d.id, {type:"statut", de:d.statut||"ouvert", a:v, creeLe:now});

    toast(`Statut : ${STATUTS[v]}`);
  }catch(e){ toast("Le statut n'a pas pu être modifié."); renderHead(d); }
}

function lightbox(id){
  const imgs=allPieces().image; let i=Math.max(0,imgs.findIndex(x=>x.id===id));

  const draw=()=>{ const x=imgs[i]; ov.innerHTML=`<div class="lb-bar"><span style="font-size:.86rem">${esc(nameOf(x?.auteur))} · ${esc(fmtDT(x?.le))} · ${i+1}/${imgs.length}</span><button type="button" data-x>Fermer</button></div>

/* ---------- dictée ---------- */
function makeDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let r=null, on=false; const H={final:[],partial:[],state:[]};
  const emit=(k,v)=>H[k].forEach(f=>f(v));
  return {
    start(){ return new Promise((res,rej)=>{
      if(on){ res(); return; }
      r=new SR(); r.lang="fr-FR"; r.continuous=true; r.interimResults=true;
      r.onstart=()=>{ on=true; emit("state",{state:"listening"}); res(); };
      r.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const tx=e.results[i][0].transcript; if(e.results[i].isFinal) emit("final",{text:" "+tx.trim()}); else interim+=tx; } emit("partial",{text:interim}); };
      r.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") rej({code:"not_granted"}); };
      r.onend=()=>{ on=false; emit("partial",{text:""}); emit("state",{state:"idle"}); };
      try{ r.start(); }catch(err){ rej({code:"upstream_error"}); }
    }); },
    stop(){ if(r) r.stop(); return Promise.resolve(); },
    active(){ return on; },
    onFinal(f){ H.final.push(f); }, onPartial(f){ H.partial.push(f); }, onState(f){ H.state.push(f); }
  };
}
function startDict(){
  const d=S.dict; if(!d) return;
  if(d.active()){ d.stop().catch(()=>{}); return; }
  d.start({language:"fr"}).catch(e=>{
    if(e&&e.code==="unavailable"){ d.start().catch(()=>{}); return; }
    if(e&&e.code==="not_granted"){ toast("Le micro est refusé : autorisez-le pour ce site pour utiliser la dictée."); const b=$("#btnDict"); if(b) b.hidden=true; }
  });
}
function wireDict(){
  const d=S.dict; if(!d) return;
  const target=()=>$("#"+(S.dictTarget||"msgTxt"));
  d.onFinal(({text})=>{ const ta=target(); if(!ta) return; ta.value = ta.value ? ta.value+text : text.replace(/^\s+/,""); if(ta.id==="msgTxt") autoGrow(ta); ta.dispatchEvent(new Event("input")); });
  d.onPartial(({text})=>{ const ta=target(); if(!ta) return; if(!ta.dataset.ph) ta.dataset.ph=ta.placeholder; ta.placeholder = text || ta.dataset.ph; });
  d.onState(({state})=>{ const on=state!=="idle"; document.querySelectorAll(".dict-btn").forEach(b=>{ b.classList.toggle("rec-on",on); b.querySelector("span").textContent = on ? "Arrêter la dictée" : (b.dataset.label||"Dicter"); }); });
}

function scheduleMsgSearch(){
  clearTimeout(msTimer);
  const q=S.f.q.trim();
  if(q.length<3){ S.msgHits=null; renderList(); return; }
  msTimer=setTimeout(async()=>{
    let hits=[];
    if(DEMO){
      const ql=q.toLowerCase();
      hits=Object.entries(DEMO.msgs).flatMap(([did,ms])=>ms.filter(m=>(m.texte||"").toLowerCase().includes(ql)).map(m=>({dossier_id:did,texte:m.texte,cree_le:m.creeLe,qui:m.qui})));

      hits=(data||[]).map(r=>({...r,cree_le:ts(r.cree_le)}));
    }
    if(S.f.q.trim()!==q) return;
    S.msgHits=hits.sort((a,b)=>(b.cree_le||0)-(a.cree_le||0)); renderList();
  },300);
}
function snippet(t,q){
  const txt=String(t||"").replace(/\s+/g," "); const i=txt.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(txt.slice(0,140));
  const a=Math.max(0,i-60), b=Math.min(txt.length,i+q.length+80);
  return (a?"… ":"")+esc(txt.slice(a,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length,b))+(b<txt.length?" …":"");
}

    <div class="dialog-actions"><button class="btn" type="button" data-close>Fermer</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",async e=>{
    if(e.target===ov||e.target.closest("[data-close]")){ ov.remove(); return; }
    const rm=e.target.closest("[data-rmacc]");
    if(rm){ const email=rm.dataset.rmacc; if(email.toLowerCase()===(S.email||"").toLowerCase()){ $("#admErr").textContent="Vous ne pouvez pas retirer votre propre adresse."; return; }
      const {error}=await sb.from("acces").delete().eq("email",email); $("#admErr").textContent = error ? "Le retrait a échoué." : `${email} n'a plus accès.`; draw(); }
  });
  const draw=async()=>{
    const {data,error}=await sb.from("acces").select("*").order("email");
    $("#admList").innerHTML = error ? "Impossible de lire la liste." : data.map(a=>`<div class="adm-row"><span>${esc(a.email)}</span>${a.admin?'<span class="chip">Administrateur</span>':""}<button class="btn btn-ghost btn-danger" type="button" data-rmacc="${esc(a.email)}" style="margin-left:auto;padding:4px 10px">Retirer</button></div>`).join("");
  };
  $("#admForm").onsubmit=async e=>{ e.preventDefault();
    const email=$("#admEmail").value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $("#admErr").textContent="Saisissez une adresse e-mail valide."; return; }
    const {error}=await sb.from("acces").upsert({email, admin:$("#admAdmin").checked});
    $("#admErr").textContent = error ? "L'ajout a échoué." : `${email} est autorisé(e). Prévenez cette personne : elle doit cliquer sur « Créer mon mot de passe ».`;
    if(!error){ $("#admEmail").value=""; $("#admAdmin").checked=false; draw(); }
  };
  draw();
}

/* ---------- démarrage ---------- */
async function start(session){
  if(S.started || !session) return; S.started=true;
  S.me=session.user.id; S.email=session.user.email;
  const {data:ok, error}=await sb.rpc("est_membre");
  if(error){ S.started=false; gate("login","La base de données ne répond pas. Vérifiez la configuration de Supabase."); return; }
  if(!ok){ S.started=false; gate("denied"); return; }
  const {data:adm}=await sb.rpc("est_admin");
  S.owner=!!adm; S.editor=true; S.canWrite=true; S.db=sb; S.assets=true;
  if(!S.dict){ S.dict=makeDictation(); if(S.dict) wireDict(); }
  gate("ok");
  $("#btnNew").hidden=false; $("#btnMe").hidden=false; $("#btnOut").hidden=false; $("#btnAdmin").hidden=!S.owner; $("#btnGmail").hidden=false; $("#btnParams").hidden=false;
  await loadMembres();
  await loadDossiers();
  const m=location.hash.match(/^#dossier-(.+)$/); if(m && S.dossiers.some(d=>d.id===m[1])) openDossier(m[1],true);
  if(!S.chan) S.chan=sb.channel("general")
    .on("postgres_changes",{event:"*",schema:"public",table:"dossiers"},()=>loadDossiers())
    .on("postgres_changes",{event:"*",schema:"public",table:"membres"},()=>loadMembres())
    .subscribe();
  if(!(S.membres[S.me]&&S.membres[S.me].nom)) setTimeout(profilForm,500);
}
$("#btnOut").addEventListener("click",()=>sb&&sb.auth.signOut());
$("#btnGmail").addEventListener("click",()=>gmailDialog());
$("#btnParams").addEventListener("click",()=>showPage("params"));
document.addEventListener("input",e=>{ if(e.target && e.target.id==="histQ"){ S.hist.q=e.target.value; const l=$("#histList"); if(l) l.innerHTML=histListHtml(); } });
$("#btnAdmin").addEventListener("click",()=>adminPanel());
fillSelects(); renderTabs(); renderDetail(); setTopH();
if(WANT_DEMO){
  const sc=document.createElement("script"); sc.src="demo-data.js";
  sc.onload=()=>{ DEMO=window.ILE_VERTE_DEMO; S.me="demo-me"; S.email="apercu@local"; S.owner=true; S.editor=true; S.canWrite=true; S.db={}; S.assets=true;
    S.membres={"demo-me":{nom:"Catherine N.",lot:"Bât. F · 176",role:"Membre du conseil"}};
    S.dossiers=DEMO.dossiers; S.loaded=true; gate("ok");
    ["#btnNew","#btnMe","#btnOut","#btnAdmin","#btnParams"].forEach(x=>{ const b=$(x); if(b) b.hidden=false; }); updateMe(); renderAll(); };
  sc.onerror=()=>gate("config"); document.head.appendChild(sc);
}
else if(!sb){ gate("config"); }
else {
  gate("loading");
  S.needPass = /type=(recovery|invite)/.test(AUTH_HASH);
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==="PASSWORD_RECOVERY"){ S.needPass=true; gate("newpass"); return; }
    if(!session){ S.started=false; S.me=null; if(S.chan){ sb.removeChannel(S.chan); S.chan=null; } closeDossierQuiet(); gate("login"); return; }
    if(S.needPass){ gate("newpass"); return; }
    setTimeout(()=>start(session),0);
  });
}
function closeDossierQuiet(){ if(S.unsubMsgs){ S.unsubMsgs(); S.unsubMsgs=null; } S.cur=null; S.msgs=[]; S.dossiers=[]; S.loaded=false; }
})();
</script>
