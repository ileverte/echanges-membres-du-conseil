<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Import des archives · Ile Verte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#F5F7F5;--surface:#fff;--ink:#16211B;--muted:#5C6B63;--line:#DCE4DF;--accent:#17694A;--err:#B3312A;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-left))}
header h1{margin:0;font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-size:1.2rem}
header a{color:var(--accent);font-size:.9rem}
main{max-width:780px;margin:22px auto;padding:0 16px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px}
h2{margin:0;font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-size:1.1rem}
p,ol{margin:0}
ol{padding-left:20px;display:grid;gap:4px}
.muted{color:var(--muted)}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;justify-self:start}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
progress{width:100%;height:12px}
.log{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;max-height:300px;overflow:auto;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px}
.ok{color:var(--accent)}.err{color:var(--err)}
label.pick{display:grid;gap:6px;border:1px dashed var(--line);border-radius:12px;padding:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Import dans Dossiers Ile Verte</h1><a href="./">← Retour à l'application</a></header>
<main>
  <section class="card"><h2>Connexion</h2><p class="muted" id="authMsg">Vérification…</p></section>

  <section class="card" id="secArch" hidden>
    <h2>Archives du syndic et e-mails</h2>
    <p class="muted">Choisissez les deux dossiers ci-dessous, l'un après l'autre, puis lancez l'import. Si la page se ferme, relancez : rien n'est importé deux fois.</p>
    <label class="pick"><span><b>1.</b> Le dossier <b>1 Magenta</b> (dans E:\5-Immobilier)</span><input type="file" class="dirIn" webkitdirectory directory multiple></label>
    <label class="pick"><span><b>2.</b> Le dossier <b>import-archives</b> (dans Documents\dossiers-ile-verte-prive)</span><input type="file" class="dirIn" webkitdirectory directory multiple></label>
    <p id="archMsg"></p>
    <button class="btn primary" id="goArch" disabled>Importer les archives</button>
    <progress id="barArch" value="0" max="1" hidden></progress>
    <div class="log" id="logArch" hidden></div>
  </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(async()=>{
const $=s=>document.querySelector(s);
const CFG=window.ILE_VERTE_CONFIG||{};
const sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
const logTo=box=>(t,c)=>{ const el=$(box); el.hidden=false; const d=document.createElement("div"); if(c) d.className=c; d.textContent=t; el.appendChild(d); el.scrollTop=1e9; };
const TYPES={pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",mp4:"video/mp4",mov:"video/quicktime",m4a:"audio/mp4",mp3:"audio/mpeg",opus:"audio/ogg",ogg:"audio/ogg",wav:"audio/wav",webm:"audio/webm",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",doc:"application/msword",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",xlsm:"application/vnd.ms-excel.sheet.macroEnabled.12",xls:"application/vnd.ms-excel",odt:"application/vnd.oasis.opendocument.text",zip:"application/zip",txt:"text/plain",vcf:"text/vcard"};
const ext=n=>(n.match(/\.([a-z0-9]+)$/i)||[,""])[1].toLowerCase();
const kindOf=n=>{ const e=ext(n); if(["jpg","jpeg","png","gif","webp"].includes(e)) return "image"; if(["mp4","mov","webm"].includes(e)&&!/^ptt|audio/i.test(n)) return "video"; if(["opus","m4a","mp3","ogg","wav","aac"].includes(e)) return "audio"; return "pdf"; };
const safe=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/-+/g,"-").slice(0,110);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-1",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const {data:{session}}=await sb.auth.getSession();
if(!session){ $("#authMsg").innerHTML='Vous n\'êtes pas connecté(e). Ouvrez d\'abord <a href="./">l\'application</a>, connectez-vous, puis revenez sur cette page.'; return; }
const {data:adm}=await sb.rpc("est_admin");
if(!adm){ $("#authMsg").textContent=`Connecté(e) avec ${session.user.email}, mais cette adresse n'est pas administratrice : l'import est réservé aux administrateurs.`; return; }
$("#authMsg").innerHTML=`<span class="ok">Connecté(e) avec ${session.user.email} (administrateur).</span>`;
$("#secArch").hidden=false;
const me=session.user.id;
const uploaded=new Set();
async function upload(path,file,log){
  if(uploaded.has(path)) return true;
  const {error}=await sb.storage.from("pieces").upload(path,file,{contentType:TYPES[ext(file.name)]||file.type||"application/octet-stream",upsert:true});
  if(error){ log(`  envoi impossible : ${file.name} (${error.message})`,"err"); return false; }
  uploaded.add(path); return true;
}

/* ---------- A. Archives ---------- */
const files={}; const bySuffix={}; let manifest=null;
const norm=p=>p.normalize("NFC").replace(/\\/g,"/").toLowerCase();
function indexFile(key,f){ const parts=norm(key).split("/"); for(let i=0;i<parts.length;i++){ const suf=parts.slice(i).join("/"); if(!(suf in bySuffix)) bySuffix[suf]=f; } }
function findFile(local){ if(files[local]) return files[local]; const parts=norm(local).split("/"); for(let i=0;i<parts.length-1;i++){ const f=bySuffix[parts.slice(i).join("/")]; if(f) return f; } return null; }
document.querySelectorAll(".dirIn").forEach(inp=>inp.addEventListener("change",async e=>{
  for(const f of e.target.files){ files[f.webkitRelativePath]=f; indexFile(f.webkitRelativePath,f); }
  const mf=Object.keys(files).find(k=>norm(k).endsWith("manifest.json"));
  if(mf) manifest=JSON.parse(await files[mf].text());
  if(!manifest){ $("#archMsg").textContent="Choisissez aussi le dossier import-archives."; return; }
  const need=manifest.messages.flatMap(m=>(m.files||[]).map(x=>x.local));
  const missing=need.filter(p=>!findFile(p));
  $("#archMsg").innerHTML=`${manifest.dossiers.length} nouveaux dossiers, ${manifest.messages.length} entrées, ${need.length} fichiers. `+(missing.length?`<span class="err">${need.length-missing.length} fichier(s) trouvé(s), ${missing.length} manquant(s) : choisissez aussi le dossier 1 Magenta (E:\\5-Immobilier\\1 Magenta).</span>`:'<span class="ok">Tous les fichiers sont trouvés.</span>');
  $("#goArch").disabled=false;
}));
$("#goArch").addEventListener("click",async()=>{
  $("#goArch").disabled=true; const log=logTo("#logArch"); const bar=$("#barArch"); bar.hidden=false;
  const total=manifest.dossiers.length+manifest.messages.length; bar.max=total; let done=0, errs=0;
  const rm=manifest.supprimer||{};
  if((rm.messages||[]).length){
    let n=0; for(let i=0;i<rm.messages.length;i+=100){ const {error,count}=await sb.from("messages").delete({count:"exact"}).in("id",rm.messages.slice(i,i+100)); if(error) log(`Retrait : ${error.message}`,"err"); else n+=count||0; }
    for(const id of (rm.dossiers||[])){ await sb.from("dossiers").delete().eq("id",id); }
    let nf=0; for(let i=0;i<(rm.pieces||[]).length;i+=100){ const {data,error}=await sb.storage.from("pieces").remove(rm.pieces.slice(i,i+100)); if(error) log(`Retrait des fichiers : ${error.message}`,"err"); else nf+=(data||[]).length; }
    log(`Documents nominatifs retirés : ${n} entrée(s), ${nf} fichier(s).`,"ok");
  }
  for(const d of manifest.dossiers){
    const row={...d}; delete row.mettre_a_jour;
    const {error}=await sb.from("dossiers").upsert(row,{onConflict:"id",ignoreDuplicates:true});
    if(error){ errs++; log(`Dossier « ${d.titre} » : ${error.message}`,"err"); }
    bar.value=++done;
  }
  log(`${manifest.dossiers.length} dossiers prêts.`,"ok");
  const have=new Map();
  const ids=manifest.messages.map(m=>m.id);
  for(let i=0;i<ids.length;i+=200){ const {data}=await sb.from("messages").select("id,pieces").in("id",ids.slice(i,i+200)); (data||[]).forEach(x=>have.set(x.id,(x.pieces||[]).length)); }
  let repaired=0;
  for(const m of manifest.messages){
    const nfiles=(m.files||[]).length;
    if(have.has(m.id) && (have.get(m.id)>=nfiles)){ bar.value=++done; continue; }
    if(have.has(m.id)){ const {error:de}=await sb.from("messages").delete().eq("id",m.id); if(de){ errs++; log(`Entrée ${m.id} : ${de.message}`,"err"); bar.value=++done; continue; } repaired++; }
    const pieces=[];
    for(const f of (m.files||[])){
      const file=findFile(f.local); if(!file){ log(`  fichier absent : ${f.local}`,"err"); errs++; continue; }
      if(await upload(f.path,file,log)) pieces.push({id:f.path,kind:f.kind,nom:f.nom,taille:file.size}); else errs++;
    }
    const row={...m, auteur:me, pieces}; delete row.files;
    const {error}=await sb.from("messages").insert(row);
    if(error){ errs++; log(`Entrée ${m.id} : ${error.message}`,"err"); }
    else log(`${new Date(m.cree_le).toLocaleDateString("fr-FR")} · ${(m.texte||"").split("\n")[0].slice(0,90)}${pieces.length?` (${pieces.length} fichier)`:""}`,"ok");
    bar.value=++done;
  }
  log(`${uploaded.size} fichier(s) envoyé(s)${repaired?`, ${repaired} entrée(s) complétée(s)`:""}.`,"ok");
  log(errs?`Terminé avec ${errs} erreur(s) : relancez pour réessayer.`:"Import terminé. Ouvrez l'application et rechargez la page.", errs?"err":"ok");
  $("#goArch").disabled=false;
});

})();
</script>
</body>
</html>
